name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p cube-core --test loom_gate --release
        env:
          RUSTFLAGS: --cfg loom
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p cube-integration-tests --test processing_loom --release
        env:
          RUSTFLAGS: --cfg loom
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  archcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p xtask
      - run: cargo xtask archcheck
      - run: cargo xtask features --check
