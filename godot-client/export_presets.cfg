; Validation presets for the mobile spike. They enable the custom feature "autotest" (runs the UI test on start
; and keeps the app alive). Signing: set GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD in the environment
; at export time; no credentials are stored here.

; Presets 2 and later (world-generation spike). Signing: set GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD
; at export time (the Android debug keystore is enough for the spike). None of these presets starts a child process:
; the renderer comes from the custom feature (cubes / faces / greedy).
;   Test ...    custom feature "worldtest": main.tscn starts the separate test entry point world_test.tscn
;   Soak ...    custom features "worldtest,soak": the same, plus a 10-minute soak loop after the smoke test
;   Client ...  custom feature "worldclient": world.tscn only; the test scripts are excluded from the package

