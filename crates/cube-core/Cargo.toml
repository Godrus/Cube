[package]
name = "cube-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Geometry Core: passive data model, coordinates and keys (PS-1)"

# Zero external dependencies (DEC-068 j). Engine and content independence is enforced by `cargo xtask archcheck`.

[dev-dependencies]
cube-testkit = { path = "../cube-testkit" }
trybuild = "1"

[lints]
workspace = true

# Only compiled under `--cfg loom` (the loom model of the commit gate, TEST-05); never in normal builds.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
