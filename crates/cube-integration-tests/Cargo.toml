[package]
name = "cube-integration-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Cross-crate integration and conformance suites (leaf crate)"

[dependencies]
cube-core = { path = "../cube-core" }
cube-processing = { path = "../cube-processing" }
cube-editing-api = { path = "../cube-editing-api" }
cube-orchestration = { path = "../cube-orchestration" }
cube-backend-voxel = { path = "../cube-backend-voxel" }
cube-backend-sdf = { path = "../cube-backend-sdf" }
cube-backend-mesh = { path = "../cube-backend-mesh" }
cube-persistence = { path = "../cube-persistence" }

[dev-dependencies]
cube-testkit = { path = "../cube-testkit" }
trybuild = "1"

# Only compiled under `--cfg loom` (TEST-08 loom models); never in normal builds.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
