[package]
name = "cube-integration-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Cross-crate integration and conformance suites (leaf crate)"

[dev-dependencies]
cube-core = { path = "../cube-core" }
cube-processing = { path = "../cube-processing" }
cube-testkit = { path = "../cube-testkit" }

# Only compiled under `--cfg loom` (TEST-08 loom models); never in normal builds.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
