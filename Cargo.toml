[workspace]
resolver = "2"
members = [
    "crates/cube-core",
    "crates/cube-processing",
    "crates/cube-editing",
    "crates/cube-persistence",
    "crates/cube-worldgen",
    "crates/cube-server",
    "crates/cube-godot-adapter",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false
license = "UNLICENSED"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3

# P-WORLD (experimental spike): the Godot editor binary loads the *debug* adapter library, which made world
# generation and meshing 2-3x slower than release. Optimise only the crates on the hot path; debug assertions stay.
[profile.dev.package.cube-core]
opt-level = 3
[profile.dev.package.cube-worldgen]
opt-level = 3
[profile.dev.package.cube-godot-adapter]
opt-level = 3
